# AgentPlaybooks with Microsoft SQL Server 2022.
# Run: docker compose -f docker-compose.mssql.yml up --build

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Express}
    volumes:
      - mssqldata:/var/opt/mssql
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  mssql-init:
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_DATABASE: ${MSSQL_DATABASE:-agentplaybooks}
      MSSQL_MASTER_URL: "Server=mssql,1433;Database=master;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD};Encrypt=true;TrustServerCertificate=true;"
    command: ["npm", "run", "db:init:mssql"]
    restart: "no"

  migrate:
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    depends_on:
      mssql-init:
        condition: service_completed_successfully
    environment:
      DB_DIALECT: mssql
      DATABASE_URL: "Server=mssql,1433;Database=${MSSQL_DATABASE:-agentplaybooks};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD};Encrypt=true;TrustServerCertificate=true;"
    command: ["npm", "run", "db:migrate:mssql:runtime"]
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DB_DIALECT: mssql
      DATABASE_URL: "Server=mssql,1433;Database=${MSSQL_DATABASE:-agentplaybooks};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD};Encrypt=true;TrustServerCertificate=true;"
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?Set SECRETS_ENCRYPTION_KEY}

volumes:
  mssqldata:
