name: Publish CLI

# Publishes packages/cli to npm as @agentplaybooks/cli.
#
# Setup required once, by a maintainer with npm access:
#   1. Create a granular npm access token scoped to the @agentplaybooks
#      organization with read+write on @agentplaybooks/cli.
#   2. Add it as the repository secret NPM_TOKEN.
#
# Prereleases publish under the `alpha` dist-tag so `npm install
# @agentplaybooks/cli` keeps resolving to the newest stable version. The tag is
# derived from the version in package.json, so a stable version publishes as
# `latest` without editing this file.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only, do not publish"
        type: boolean
        default: true
  push:
    tags: ["cli-v*"]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The CLI has no dependencies, so its tests run straight from the source.
      - run: node --test

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          tag_version="${GITHUB_REF_NAME#cli-v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version." >&2
            exit 1
          fi

      - name: Resolve dist-tag
        id: disttag
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-alpha*) echo "tag=alpha" >> "$GITHUB_OUTPUT" ;;
            *-beta*) echo "tag=beta" >> "$GITHUB_OUTPUT" ;;
            *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --access public --provenance --tag ${{ steps.disttag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
